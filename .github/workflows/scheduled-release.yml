name: Scheduled Release

# Creates a patch release twice per week (Monday and Friday, near end of UTC day).
#
# Scheduled runs — only create when NONE exists in that slot's window.
# Windows must not overlap: Friday's 23:00 cron often slips to Saturday
# 00:xx UTC, so a Sat published_at is still the Friday slot — Monday must
# not treat it as "already released this window".
#
#   Monday slot  → Sun–Tue (Mon cron + Tue-morning delay; excludes Sat)
#   Friday slot  → Wed–Sat (Fri cron + Sat-morning delay; excludes Mon)
#
# Manual "Run workflow" — always creates a new patch release (forced).
#
# Before releasing, the full supported PHP/Laravel matrix is tested once each
# with --prefer-stable (no --prefer-lowest — that drift-detection concern is
# already covered continuously by the run-tests workflow on every push to
# main, not re-checked again here) so a broken combination never ships.

on:
  schedule:
    - cron: '0 23 * * 1,5'
  workflow_dispatch:
    # always ships a new release.

permissions:
  contents: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      slot: ${{ steps.gate.outputs.slot }}
      slot_day: ${{ steps.gate.outputs.today }}
      window_start: ${{ steps.gate.outputs.window_start }}
      window_end: ${{ steps.gate.outputs.window_end }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: UTC
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Manual trigger always creates a new release.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TODAY="$(date -u +%Y-%m-%d)"
            echo "Manual run — forcing a new release (${TODAY} UTC)."
            echo "today=${TODAY}" >> "${GITHUB_OUTPUT}"
            echo "slot=manual" >> "${GITHUB_OUTPUT}"
            echo "window_start=${TODAY}" >> "${GITHUB_OUTPUT}"
            echo "window_end=${TODAY}" >> "${GITHUB_OUTPUT}"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # If this scheduled job slipped into the next UTC morning, still count
          # it as the previous day's release slot (covers 23:00 cron delayed to 00:xx).
          HOUR="$(date -u +%H)"
          HOUR=$((10#${HOUR}))
          if [ "${HOUR}" -lt 12 ]; then
            SLOT_DAY="$(date -u -d 'yesterday' +%Y-%m-%d)"
            echo "Runner UTC hour is ${HOUR} — attributing slot day to yesterday (${SLOT_DAY})."
          else
            SLOT_DAY="$(date -u +%Y-%m-%d)"
          fi

          # ISO weekday: 1=Mon … 7=Sun
          DOW="$(date -u -d "${SLOT_DAY}" +%u)"
          DOW=$((10#${DOW}))

          # Map the slot to a non-overlapping release window (see header comment).
          # Weekend fallout / mid-week → nearest matching window.
          if [ "${DOW}" -eq 1 ]; then
            WINDOW_START="$(date -u -d "${SLOT_DAY} - 1 day" +%Y-%m-%d)"
            WINDOW_END="$(date -u -d "${SLOT_DAY} + 1 day" +%Y-%m-%d)"
            SLOT_NAME="monday"
          elif [ "${DOW}" -eq 5 ]; then
            WINDOW_START="$(date -u -d "${SLOT_DAY} - 2 days" +%Y-%m-%d)"
            WINDOW_END="$(date -u -d "${SLOT_DAY} + 1 day" +%Y-%m-%d)"
            SLOT_NAME="friday"
          elif [ "${DOW}" -eq 6 ] || [ "${DOW}" -eq 7 ]; then
            # Late Friday run that landed on the weekend: still Friday window.
            while [ "$(date -u -d "${SLOT_DAY}" +%u)" != "5" ]; do
              SLOT_DAY="$(date -u -d "${SLOT_DAY} - 1 day" +%Y-%m-%d)"
            done
            WINDOW_START="$(date -u -d "${SLOT_DAY} - 2 days" +%Y-%m-%d)"
            WINDOW_END="$(date -u -d "${SLOT_DAY} + 1 day" +%Y-%m-%d)"
            SLOT_NAME="friday"
          else
            # Tue–Thu odd delay: treat as Friday window for this week.
            DAYS_TO_FRI=$((5 - DOW))
            FRI_DAY="$(date -u -d "${SLOT_DAY} + ${DAYS_TO_FRI} days" +%Y-%m-%d)"
            WINDOW_START="$(date -u -d "${FRI_DAY} - 2 days" +%Y-%m-%d)"
            WINDOW_END="$(date -u -d "${FRI_DAY} + 1 day" +%Y-%m-%d)"
            SLOT_NAME="friday"
          fi

          echo "today=${SLOT_DAY}" >> "${GITHUB_OUTPUT}"
          echo "slot=${SLOT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "window_start=${WINDOW_START}" >> "${GITHUB_OUTPUT}"
          echo "window_end=${WINDOW_END}" >> "${GITHUB_OUTPUT}"
          echo "Slot=${SLOT_NAME}; window ${WINDOW_START} → ${WINDOW_END} (UTC)"

          HAS_IN_WINDOW=0
          # Prefer matching this slot's note marker (survives published_at drift).
          # Fall back to published_at inside the non-overlapping calendar window.
          while IFS=$'\t' read -r published body; do
            [ -z "${published}" ] && continue
            local_day="$(TZ=UTC date -d "${published}" +%Y-%m-%d 2>/dev/null || true)"
            [ -z "${local_day}" ] && continue

            note_match=0
            if printf '%s' "${body}" | grep -qi "Automated ${SLOT_NAME} release"; then
              # Same ISO week as the slot day → this slot already shipped.
              pub_week="$(TZ=UTC date -d "${published}" +%G-W%V 2>/dev/null || true)"
              slot_week="$(TZ=UTC date -d "${SLOT_DAY}" +%G-W%V 2>/dev/null || true)"
              if [ -n "${pub_week}" ] && [ "${pub_week}" = "${slot_week}" ]; then
                note_match=1
              fi
            fi

            in_calendar=0
            if [[ ! "${local_day}" < "${WINDOW_START}" && ! "${local_day}" > "${WINDOW_END}" ]]; then
              in_calendar=1
            fi

            if [ "${note_match}" -eq 1 ] || [ "${in_calendar}" -eq 1 ]; then
              HAS_IN_WINDOW=1
              if [ "${note_match}" -eq 1 ]; then
                echo "Found ${SLOT_NAME} release on ${local_day} (published ${published}) via release notes."
              else
                echo "Found release on ${local_day} (published ${published}) inside window."
              fi
              break
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" --jq '.[] | [.published_at, (.body // "")] | @tsv' 2>/dev/null || true)

          if [ "${HAS_IN_WINDOW}" -eq 1 ]; then
            echo "A ${SLOT_NAME} release already exists for ${WINDOW_START}→${WINDOW_END}. Skipping."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "No ${SLOT_NAME} release in window — will create one."
          echo "should_release=true" >> "${GITHUB_OUTPUT}"

  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - prefer-stable - ${{ matrix.os }}
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*, 11.*]
        include:
          - laravel: 13.*
            testbench: ^11.3
          - laravel: 12.*
            testbench: ^10.14
          - laravel: 11.*
            testbench: ^9.19
        exclude:
          - laravel: 11.*
            php: 8.5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  release:
    name: Create GitHub release
    needs: [gate, test]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Compute next patch version
        id: version
        run: |
          set -euo pipefail

          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "${latest}" ]; then
            latest="$(git tag -l '*.*.*' --sort=-v:refname | head -n 1 || true)"
          fi

          if [ -z "${latest}" ]; then
            next="v1.0.0"
          else
            bare="${latest#v}"
            IFS='.' read -r major minor patch <<< "${bare}"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi

          echo "latest=${latest:-none}" >> "${GITHUB_OUTPUT}"
          echo "next=${next}" >> "${GITHUB_OUTPUT}"
          echo "Next release tag: ${next} (previous: ${latest:-none})"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NEXT="${{ steps.version.outputs.next }}"
          SLOT="${{ needs.gate.outputs.slot }}"
          SLOT_DAY="${{ needs.gate.outputs.slot_day }}"
          WINDOW_START="${{ needs.gate.outputs.window_start }}"
          WINDOW_END="${{ needs.gate.outputs.window_end }}"

          NOTES="Automated ${SLOT} release (${SLOT_DAY} UTC). Window ${WINDOW_START} → ${WINDOW_END}."

          gh release create "${NEXT}" \
            --target "${{ github.event.repository.default_branch || 'main' }}" \
            --title "${NEXT}" \
            --notes "${NOTES}"

          echo "Created release ${NEXT}"
